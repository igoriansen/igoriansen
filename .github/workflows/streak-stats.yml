name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/Sao_Paulo"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

  workflow_dispatch:

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=${{ github.repository_owner }}&theme=youtube-dark&mode=weekly&hide_border=true&background=00000000"
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update streak stats"
            git push
          fi